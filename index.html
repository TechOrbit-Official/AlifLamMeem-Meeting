<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <title>AlifLamMeem - تسجيل الدخول</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        
    :root {
        --bg-dark: #0a0f1a;
        --bg-card: #111827;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --text: #e5e7eb;
        --text-secondary: #9ca3af;
        --border: #1f2937;
        --error: #ef4444;
        --success: #22c55e;
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: var(--bg-dark);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
    }
    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }
    .bg-circle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent);
        animation: float 20s infinite;
    }
    .bg-circle:nth-child(1) {
        width: 600px;
        height: 600px;
        top: -200px;
        right: -200px;
        animation-delay: 0s;
    }
    .bg-circle:nth-child(2) {
        width: 400px;
        height: 400px;
        bottom: -100px;
        left: -100px;
        animation-delay: -5s;
    }
    .bg-circle:nth-child(3) {
        width: 300px;
        height: 300px;
        top: 50%;
        left: 50%;
        animation-delay: -10s;
    }
    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(50px, -50px) scale(1.1); }
        50% { transform: translate(0, -100px) scale(1); }
        75% { transform: translate(-50px, -50px) scale(0.9); }
    }
    .login-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 450px;
    }
    .login-card {
        background: var(--bg-card);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
        backdrop-filter: blur(20px);
    }
    .logo-section {
        text-align: center;
        margin-bottom: 35px;
    }
    .logo-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 35px;
        color: white;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }
    .logo-section h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 5px;
    }
    .logo-section p {
        color: var(--text-secondary);
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .form-group label i {
        margin-left: 8px;
        color: var(--primary);
    }
    .input-wrapper {
        position: relative;
    }
    .input-wrapper input {
        width: 100%;
        padding: 14px 45px 14px 15px;
        background: #1a2332;
        border: 2px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 15px;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    .input-wrapper input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        background: #1f2937;
    }
    .input-wrapper .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 18px;
    }
    .login-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    .login-btn:active {
        transform: translateY(0);
    }
    .login-btn:disabled {
        background: #374151;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
    .login-btn .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin: 0 auto;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--error);
        color: var(--error);
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        text-align: center;
    }
    .error-message.show {
        display: block;
        animation: shake 0.5s;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }
    .success-message {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid var(--success);
        color: var(--success);
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        text-align: center;
    }
    .success-message.show {
        display: block;
    }
    .features-list {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }
    .feature-item {
        text-align: center;
        color: var(--text-secondary);
        font-size: 12px;
    }
    .feature-item i {
        display: block;
        font-size: 20px;
        margin-bottom: 5px;
        color: var(--primary);
    }
    /* Responsive */
    @media (max-width: 480px) {
        .login-card {
            padding: 25px;
        }
        
        .logo-section h1 {
            font-size: 24px;
        }
    }
    </style>
</head>
<body>
    <!-- خلفية متحركة -->
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- بطاقة تسجيل الدخول -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h1>AlifLamMeem</h1>
                <p>نظام التواصل التعليمي</p>
            </div>

            <div class="error-message" id="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text"></span>
            </div>

            <div class="success-message" id="success-message">
                <i class="fa-solid fa-circle-check"></i>
                <span id="success-text"></span>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> اسم المستخدم أو البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم أو البريد" required autocomplete="username">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <span id="btn-text">تسجيل الدخول</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>

            <div class="features-list">
                <div class="feature-item">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>آمن</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-bolt"></i>
                    <span>سريع</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-user-group"></i>
                    <span>خاص</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============= إعدادات JSONBin =============
        const JSONBIN_BIN_ID = '6a6d2605f5f4af5e29dbfa01'; // Bin ID
        const JSONBIN_API_KEY = '$2a$10$sfiB90gKWRuo/rVlGmq5MeMcJh7ku6DSmHwuviKkYoTlZa.C.6bmu'; // API Key
        const CHECK_INTERVAL = 30000; // 30 ثانية
        let BASE_URL = "";
        const API_KEY = "AlifLamMeem_Secret_2026";

        // ============= جلب الرابط من JSONBin =============
        async function getServerUrl() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Access-Key': JSONBIN_API_KEY }
                });
            
                const data = await res.json();
            
                BASE_URL = data.record?.url 
                        || data.record?.['url']
                        || data.url 
                        || data['url']
                        || '';
            
                if (BASE_URL) {
                    console.log('✅ الرابط:', BASE_URL);
                }
            
            } catch (e) {
                console.error('❌ خطأ:', e);
            }
        }

        getServerUrl();
        setInterval(getServerUrl, CHECK_INTERVAL)

        // ============= دوال العرض =============
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            document.getElementById('error-text').textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('success-message').classList.remove('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            document.getElementById('success-text').textContent = message;
            successDiv.classList.add('show');
            document.getElementById('error-message').classList.remove('show');
            setTimeout(() => successDiv.classList.remove('show'), 3000);
        }

        function setLoading(loading) {
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            
            btn.disabled = loading;
            if (loading) {
                btnText.style.display = 'none';
                spinner.style.display = 'block';
            } else {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        // ============= تسجيل الدخول =============
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showError('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            setLoading(true);
            console.log('🔐 محاولة تسجيل الدخول:', { username });

            try {
                const response = await fetch(`${BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({
                        username_or_email: username,
                        password: password
                    })
                });

                const data = await response.json();
                console.log('📥 رد السيرفر:', data);

                if (response.ok && data.success) {
                    // ✅ حفظ بيانات المستخدم في localStorage
                    const userData = {
                        username: data.username,
                        nickname: data.nickname,
                        role: data.role,
                        id: data.id,
                        with_teacher: data.with_teacher,
                        loginTime: new Date().toISOString()
                    };
                    
                    // حفظ البيانات
                    localStorage.setItem('alm_user', JSON.stringify(userData));
                    console.log('💾 تم حفظ بيانات المستخدم:', userData);
                    
                    // التحقق من الحفظ
                    const saved = localStorage.getItem('alm_user');
                    console.log('✅ تأكيد الحفظ:', saved ? 'تم الحفظ بنجاح' : 'فشل الحفظ!');
                    
                    showSuccess('تم تسجيل الدخول بنجاح! جاري التحويل...');
                    
                    // تأخير بسيط قبل التحويل
                    setTimeout(() => {
                        console.log('🚀 التحويل إلى صفحة المحادثة...');
                        window.location.href = '/chat.html';
                    }, 1000);
                    
                } else {
                    showError(data.error || 'بيانات الدخول غير صحيحة');
                }
            } catch (error) {
                console.error('❌ خطأ في تسجيل الدخول:', error);
                showError('حدث خطأ في الاتصال بالخادم. تأكد من تشغيل السيرفر.');
            } finally {
                setLoading(false);
            }
        }

        // ============= التحقق من الجلسة عند التحميل =============
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 تم تحميل صفحة تسجيل الدخول');
            
            const userData = localStorage.getItem('alm_user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    console.log('👤 تم العثور على جلسة سابقة:', user.username);
                    
                    // التحقق من صحة الجلسة (اختياري)
                    if (user.username && user.role) {
                        // يمكن إضافة فحص إضافي مع السيرفر
                        console.log('✅ الجلسة صالحة، يمكن التحويل مباشرة');
                        window.location.href = '/chat.html';
                    }
                } catch (e) {
                    console.log('🗑️ بيانات جلسة غير صالحة، جاري المسح');
                    localStorage.removeItem('alm_user');
                }
            }
        });

        // ============= دعم كيبورد (Enter) =============
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                const form = document.getElementById('login-form');
                if (form) {
                    handleLogin(e);
                }
            }
        });

        console.log('✅ صفحة تسجيل الدخول جاهزة');

    </script>
</body>
</html>
